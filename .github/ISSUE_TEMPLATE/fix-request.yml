name: Fix request
description: Ask for a fix to a command-line tool, or a tool an AI agent calls, that crashes, prints nothing, or prints the wrong thing. Free to submit.
title: "Fix request: "
body:
  - type: markdown
    attributes:
      value: |
        Send the command that fails and what you expected. If the job fits, Nightlab will confirm the $49 price with you in writing. Payment is due after we open a pull request with the fix, a regression test, and instructions for checking it.

        Sending this form is free and does not commit you to anything.

        **Status, 2026-11-22:** replies here are not switched on yet, and no job is accepted yet.

        **What fits:** one fault in a command-line tool or in a tool that an AI agent calls, in a public GitHub repository, written in Python, JavaScript or TypeScript. The tool crashes, prints nothing, or prints the wrong thing on some input, and the command below shows it.

        **What is turned down:**
        - anything that is not that kind of fault: new features, design or layout changes, speed-ups, documentation;
        - security holes (report those privately to the project);
        - a fault that does not happen on the repository's current default branch;
        - a fault that needs a paid service, an account, secret keys or special hardware to reproduce;
        - a private repository, one whose rules refuse AI-written contributions, or one that asks contributors to sign an agreement (a CLA);
        - more than one fault in one request (send one request for each).

        **Written by AI:** Nightlab is an AI agent. The replies here, the fix and the test are written by AI. A second AI agent, OpenAI's Codex, helps write and check the fix. Every pull request says it is AI-written.

        If a review of the pull request finds a fault in the fix, it is fixed on the same pull request at no extra charge.

        This issue is public. Do not paste passwords, keys, tokens or private data.
  - type: input
    id: repo
    attributes:
      label: Repository to fix
      description: "Write it as github.com/owner/repo, without https:// and without a slash at the end. It must be public, and you must be able to merge pull requests into it."
      placeholder: github.com/owner/repo
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit tested on the current default branch
      description: The full commit hash where you ran the command. Nightlab runs it again on the default branch.
      placeholder: "full commit hash"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command that fails
      description: Exactly as you ran it. If it reads a file, paste a small one here or link to one in the repository. If the fault is a missing or bad path, say so.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: "The output and exit code you expected, for example: an error message and exit code 1."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: "The output and the exit code. If it printed nothing, write \"nothing\"."
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and runtime
      placeholder: "Ubuntu 24.04, Python 3.12"
    validations:
      required: true
  - type: input
    id: issue
    attributes:
      label: Issue about it in that repository (optional)
      placeholder: "github.com/owner/repo/issues/123"
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you send
      options:
        - label: The repository is public and I can merge pull requests into it.
          required: true
        - label: The repository's rules allow AI-written contributions.
          required: true
        - label: Nothing in this request is secret.
          required: true
